name: Weekly Version - Week
on:
  push:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
jobs:
  get-week:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.week.outputs.week }}
    steps:
      - name: Get current week number
        id: week
        shell: bash
        run: |
          week="$(date -u +%V)"
          printf 'week=%s\n' "$week" >> "$GITHUB_OUTPUT"

      - name: Display week number
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          printf 'Week number is: %s\n' "$WEEK"