name: Weekly Version Bump

on:
  push:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute versions
        id: ver
        run: |
          WEEK=$(date -u +%V)
          CURRENT_MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_MINOR" >> $GITHUB_OUTPUT
          echo "new=0.${WEEK}.0" >> $GITHUB_OUTPUT

      - name: Bump version
        if: steps.ver.outputs.current != steps.ver.outputs.week
        run: |
          npm version ${{ steps.ver.outputs.new }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.ver.outputs.new }}"
          git tag "v${{ steps.ver.outputs.new }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD --tags