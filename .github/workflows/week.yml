name: Weekly Version

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday 00:00 UTC (scheduled only, no manual trigger)

permissions:
  contents: write

jobs:
  weekly-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set week in version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")   
          WEEK=$((10#$(date +%V)))                                 
          NEW=$(echo "$CURRENT" | awk -F. -v OFS=. -v w="$WEEK" '{ $2 = w; print }')

          if [ "$NEW" = "$CURRENT" ]; then
            echo "Version already up to date: $CURRENT"
            exit 0
          fi

          npm version "$NEW" --no-git-tag-version                  
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.new_version != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: weekly version ${{ steps.bump.outputs.new_version }}"
          git push