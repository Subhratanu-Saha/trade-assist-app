name: Weekly Version - Week
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
jobs:
  get-week:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.week.outputs.week }}
    steps:
      - name: Get current week number
        id: week
        run: |
          WEEK=$(date -u +%V)
          echo "Current week number: $WEEK"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Display week number
        run: |
          echo "Week number is: ${{ steps.week.outputs.week }}"