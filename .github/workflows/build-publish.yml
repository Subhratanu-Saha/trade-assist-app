name: Build and Test

on:
  push:
    branches:
      - main
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: App Build
        run : npm run build

      - name: Deploy to render server
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}

      

      
